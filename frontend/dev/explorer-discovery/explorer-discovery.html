<!doctype html>
<!--
  PREVIEW ONLY (dev): how the founder home could point to the three explorers.
  It uses the real sidebar (layout.js) and the real chat styles, then:
    1. moves the sidebar's Explore group under "New assessment", in its own tinted box
    2. adds three explorer cards to the chat home, under the greeting
  Nothing on the real pages changes. Open with ?before to see today's version.
  Delete this folder when the decision is made.
-->
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Darb · explorer preview</title>
  <link rel="stylesheet" href="../../shared/shared.css">
  <link rel="stylesheet" href="../../pages/founder/chatbot/chatbot.css">
  <style>
    /* ---------- 1. The sidebar's Explore group ---------- */
    .explore-box {
      margin: 14px 0 6px;
      padding: 4px 6px 8px;
      border: 1px solid #DDE6F3;
      border-radius: 14px;
      background: var(--navy-tint);
    }
    .explore-box .sidebar-label {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 6px 6px;
      font-size: 12.5px;
      font-weight: 800;
      color: var(--navy);
    }
    .explore-box .nav-item { color: var(--text); }
    .explore-box .nav-item svg { color: var(--navy); }
    .explore-box .nav-item:hover { background: #fff; }
    .sidebar-divider {
      height: 1px;
      margin: 6px 10px;
      background: var(--border);
    }

    /* ---------- 2. The explorer cards on the chat home ---------- */
    .explore-cards {
      width: 100%;
      max-width: 640px;
      margin: 26px auto 0;
    }
    .explore-cards-label {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-3);
    }
    .explore-cards-label::before,
    .explore-cards-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .explore-cards-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .explore-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fff;
      text-align: start;
      color: var(--text);
      box-shadow: var(--shadow-sm);
      transition: transform var(--dur-fast), box-shadow var(--dur-fast), border-color var(--dur-fast);
    }
    .explore-card:hover {
      transform: translateY(-2px);
      border-color: #DDE6F3;
      box-shadow: 0 10px 24px -14px rgba(15, 36, 56, .35);
    }
    .explore-card-icon {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: var(--navy-tint);
      color: var(--navy);
    }
    .explore-card strong { font-size: 13.5px; font-weight: 800; line-height: 1.35; }
    .explore-card-count {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-3);
    }

    html[dir="rtl"] .flip-rtl svg { transform: scaleX(-1); }

    /* phone: one row, icon and short name only */
    @media (max-width: 600px) {
      .explore-card { padding: 10px; align-items: center; text-align: center; }
      .explore-card strong { font-size: 12px; }
      .explore-card-count { display: none; }
    }

    /* the before / after switch, only on this preview */
    .preview-switch {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--navy);
      color: #fff;
      font-size: 12.5px;
      font-weight: 700;
      box-shadow: 0 10px 24px -10px rgba(15, 36, 56, .5);
    }
  </style>
</head>
<body data-layout="founder" data-page="chatbot">

  <main>
    <section class="chat" id="chat">
      <div class="chat-home" id="chat-home">
        <span class="avatar avatar-darb chat-home-mark"><img src="../../assets/images/darb-mark.png" alt=""></span>
        <h1 class="chat-greeting" id="greeting"></h1>
        <p class="chat-question" data-i18n="chat.homeSub"></p>
        <!-- the explorer cards go here (after version) -->
      </div>

      <div class="chat-bottom">
        <div class="chat-examples" id="examples">
          <button type="button" class="pill" data-i18n="chat.exampleLabel.0"></button>
          <button type="button" class="pill" data-i18n="chat.exampleLabel.1"></button>
          <button type="button" class="pill" data-i18n="chat.exampleLabel.2"></button>
        </div>
        <form class="composer glass" onsubmit="return false">
          <div class="composer-row">
            <textarea class="composer-input" rows="1" data-i18n-placeholder="chat.placeholder"></textarea>
            <button type="submit" class="composer-send"></button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <a class="preview-switch" id="preview-switch"></a>

  <script type="module">
    import { icon } from '../../shared/layout.js';
    import { supabase } from '../../shared/supabase.js';

    const before = new URLSearchParams(location.search).has('before');
    const arabic = localStorage.getItem('darb-language') === 'ar';
    const words = arabic
      ? { greet: 'صباح الخير', browse: 'أو تصفّح المنظومة', before: 'عرض الوضع الحالي', after: 'عرض المقترح',
          units: ['شركة ناشئة', 'برنامج دعم', 'متطلب تنظيمي'] }
      : { greet: 'Good morning', browse: 'Or browse the ecosystem', before: 'Show today', after: 'Show the proposal',
          units: ['startups', 'support programs', 'requirements'] };

    document.querySelector('#greeting').textContent = words.greet;

    const toggle = document.querySelector('#preview-switch');
    toggle.textContent = before ? words.after : words.before;
    toggle.href = before ? location.pathname : `${location.pathname}?before`;

    if (!before) {
      /* 1. Sidebar: take the Explore heading and its three links, put them in a box under "New assessment" */
      const sidebar = document.querySelector('.sidebar');
      const heading = sidebar.querySelector('.sidebar-label[data-i18n="nav.explore"]');
      const links = [];
      let next = heading.nextElementSibling;
      while (next && next.classList.contains('nav-item')) {
        links.push(next);
        next = next.nextElementSibling;
      }

      const box = document.createElement('div');
      box.className = 'explore-box';
      heading.insertAdjacentHTML('afterbegin', icon('map'));
      box.append(heading, ...links);

      const newAssessment = sidebar.querySelector('.nav-item-strong');
      const divider = document.createElement('div');
      divider.className = 'sidebar-divider';
      newAssessment.after(box);
      box.after(divider);

      /* 2. Chat home: three explorer cards, using the same links and icons as the sidebar */
      const cards = links.map((link, index) => `
        <a class="explore-card" href="${link.href}">
          <span class="explore-card-icon">${link.querySelector('svg').outerHTML}</span>
          <strong data-i18n="${link.querySelector('span').dataset.i18n}"></strong>
          <span class="explore-card-count"><span data-count="${index}">…</span><span class="flip-rtl">${icon('chevron')}</span></span>
        </a>`).join('');

      document.querySelector('#chat-home').insertAdjacentHTML('beforeend', `
        <div class="explore-cards">
          <div class="explore-cards-label">${words.browse}</div>
          <div class="explore-cards-row">${cards}</div>
        </div>`);

      /* the counts come from the database, so they stay right when the data changes */
      const tables = ['startups', 'support_organizations', 'regulatory_requirements'];
      const number = new Intl.NumberFormat(arabic ? 'ar-SA' : 'en-US');
      tables.forEach(async (table, index) => {
        const { count, error } = await supabase.from(table).select('*', { count: 'exact', head: true });
        const spot = document.querySelector(`[data-count="${index}"]`);
        spot.textContent = error ? '' : `${number.format(count)} ${words.units[index]}`;
      });
    }
  </script>
  <script type="module" src="../../shared/layout.js"></script>
</body>
</html>
