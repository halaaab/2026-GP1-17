<!doctype html>
<!--
  PROFILE (founder side)
  The signed-in founder's account: name, email, mobile number, region (the
  country is fixed to Saudi Arabia), the language Darb uses, a new password,
  logging out, and deleting the account. Laid out like the admin's Profile.
  Reads and saves the founder's own row in the users table (migrations 0001
  and 0002: a founder may edit only their own row). A new email is saved by
  Supabase Auth, which first emails a confirmation link. Deleting calls
  delete_my_account() (migration 0001).
-->
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Darb</title>
  <link rel="stylesheet" href="../../../shared/shared.css">
  <link rel="stylesheet" href="profile.css?v=4">
</head>
<body data-layout="founder" data-page="profile" data-title="profile.title" data-denied="403">

  <!-- The same layout as the admin's Profile (the profile styles in shared/shared.css).
       Words shared with the admin page use the adminProfile.* translations. -->
  <main>
    <div class="page-head">
      <div>
        <h2 class="page-title" data-i18n="profile.title"></h2>
        <p class="text-2" data-i18n="profile.sub"></p>
      </div>
    </div>

    <!-- shown while loading -->
    <p class="empty" id="status"><span class="spinner"></span></p>

    <div id="content" hidden>

    <!-- Who is signed in -->
    <section class="card profile-hero fade-up">
      <span class="avatar profile-avatar" id="hero-avatar"></span>
      <div class="profile-hero-text">
        <div class="profile-hero-name">
          <h3 id="hero-name"></h3>
          <span class="chip chip-navy" data-i18n="role.founder"></span>
        </div>
        <p class="text-2 profile-hero-line" id="hero-line"></p>
      </div>
      <div class="profile-hero-facts">
        <div class="profile-hero-fact">
          <span class="text-3" data-i18n="profile.memberSince"></span>
          <strong id="member-since">—</strong>
        </div>
        <div class="profile-hero-fact">
          <span class="text-3" data-i18n="founders.assessments"></span>
          <strong id="assessments">—</strong>
        </div>
        <div class="profile-hero-fact">
          <span class="text-3" data-i18n="founders.userType"></span>
          <strong id="user-type">—</strong>
        </div>
      </div>
    </section>

    <div class="profile-columns">

      <!-- Personal details -->
      <section class="card profile-card fade-up" style="--i: 1">
        <div class="profile-card-head">
          <div>
            <h3 class="section-title" data-i18n="profile.personal"></h3>
            <p class="text-3" data-i18n="profile.personalSub"></p>
          </div>
        </div>

        <form class="form" id="profile-form" novalidate>
          <div class="field">
            <label class="label is-required" for="full-name" data-i18n="founders.fullName"></label>
            <input class="input" id="full-name" type="text" autocomplete="name" dir="auto">
            <p class="field-error" id="full-name-error" hidden></p>
          </div>

          <div class="field">
            <label class="label is-required" for="email" data-i18n="founders.email"></label>
            <input class="input" id="email" type="email" autocomplete="email" dir="ltr">
            <p class="field-hint" id="email-hint" data-i18n="profile.emailHint"></p>
            <p class="field-error" id="email-error" hidden></p>
          </div>

          <div class="form-row">
            <div class="field">
              <label class="label" for="phone" data-i18n="profile.phone"></label>
              <!-- a phone number reads left to right in both languages -->
              <div class="profile-prefix" dir="ltr">
                <span class="profile-prefix-sign">+966</span>
                <input class="input" id="phone" type="tel" inputmode="numeric" maxlength="9" autocomplete="tel-national" dir="ltr" placeholder="5XXXXXXXX">
              </div>
              <p class="field-error" id="phone-error" hidden></p>
            </div>
            <div class="field">
              <label class="label is-required" for="region" data-i18n="signup.region"></label>
              <select class="input" id="region">
                <option value="" data-i18n="signup.select"></option>
                <option value="riyadh" data-i18n="signup.region.riyadh"></option>
                <option value="makkah" data-i18n="signup.region.makkah"></option>
                <option value="madinah" data-i18n="signup.region.madinah"></option>
                <option value="eastern" data-i18n="signup.region.eastern"></option>
                <option value="qassim" data-i18n="signup.region.qassim"></option>
                <option value="asir" data-i18n="signup.region.asir"></option>
                <option value="tabuk" data-i18n="signup.region.tabuk"></option>
                <option value="hail" data-i18n="signup.region.hail"></option>
                <option value="northern_borders" data-i18n="signup.region.northern_borders"></option>
                <option value="jazan" data-i18n="signup.region.jazan"></option>
                <option value="najran" data-i18n="signup.region.najran"></option>
                <option value="baha" data-i18n="signup.region.baha"></option>
                <option value="jawf" data-i18n="signup.region.jawf"></option>
              </select>
              <p class="field-error" id="region-error" hidden></p>
            </div>
          </div>

          <div class="field">
            <label class="label" for="country" data-i18n="signup.country"></label>
            <!-- fixed: Darb serves founders located in Saudi Arabia. profile.js writes the name in the page's language -->
            <input class="input" id="country" type="text" readonly>
            <p class="field-hint" data-i18n="profile.countryHint"></p>
          </div>

          <div class="profile-form-foot">
            <span class="text-3" id="details-status"></span>
            <button type="button" class="btn btn-secondary" id="details-reset" data-i18n="adminProfile.discard" disabled></button>
            <button type="submit" class="btn btn-primary" id="save" data-i18n="adminProfile.save" disabled></button>
          </div>
        </form>
      </section>

      <div class="profile-side">
        <!-- Language: language.js switches the page; profile.js saves the choice so Darb answers in it -->
        <section class="card profile-card fade-up" style="--i: 2">
          <div class="profile-row">
            <div>
              <h3 class="section-title" data-i18n="adminProfile.language"></h3>
              <p class="text-3" data-i18n="profile.languageSub"></p>
            </div>
            <div class="segmented pf-language">
              <button type="button" class="segmented-item" data-language="en">English</button>
              <button type="button" class="segmented-item" data-language="ar">العربية</button>
            </div>
          </div>
        </section>

      </div>
    </div>

    <!-- Security: a new password (the same as the admin's Profile, without the two-step sign-in) -->
    <section class="card profile-card fade-up" style="--i: 4">
      <div class="profile-card-head">
        <div>
          <h3 class="section-title" data-i18n="adminProfile.security"></h3>
          <p class="text-3" data-i18n="profile.securitySub"></p>
        </div>
      </div>

      <form class="form profile-password" id="password-form" novalidate>
        <div class="form-row">
          <div class="field">
            <label class="label is-required" for="new-password" data-i18n="adminProfile.newPassword"></label>
            <div class="input-group">
              <input class="input" id="new-password" type="password" autocomplete="new-password">
              <button type="button" class="btn-icon" data-password-toggle data-i18n-aria-label="adminProfile.showPassword" id="toggle-1"></button>
            </div>
          </div>
          <div class="field">
            <label class="label is-required" for="confirm-password" data-i18n="adminProfile.confirmPassword"></label>
            <div class="input-group">
              <input class="input" id="confirm-password" type="password" autocomplete="new-password">
              <button type="button" class="btn-icon" data-password-toggle data-i18n-aria-label="adminProfile.showPassword" id="toggle-2"></button>
            </div>
            <p class="field-error" id="confirm-error" hidden data-i18n="adminProfile.passwordsDiffer"></p>
          </div>
        </div>

        <ul class="rules" id="password-rules">
          <li data-rule="length" data-i18n="reset.rule1"></li>
          <li data-rule="lower" data-i18n="reset.rule2"></li>
          <li data-rule="upper" data-i18n="reset.rule3"></li>
          <li data-rule="number" data-i18n="reset.rule4"></li>
          <li data-rule="symbol" data-i18n="reset.rule5"></li>
        </ul>

        <div class="profile-form-foot">
          <button type="submit" class="btn btn-primary" id="password-save" data-i18n="adminProfile.updatePassword" disabled></button>
        </div>
      </form>
    </section>

    <!-- Delete account: last on the page, on its own -->
    <section class="card profile-card profile-row fade-up" style="--i: 5">
      <div>
        <h3 class="section-title" data-i18n="founders.delete"></h3>
        <p class="text-3" data-i18n="profile.deleteSub"></p>
      </div>
      <button type="button" class="btn pf-danger-soft" data-modal-open="delete-modal" data-i18n="founders.delete"></button>
    </section>

    </div>

    <dialog class="modal" id="delete-modal">
      <span class="empty-icon pf-delete-icon" id="delete-icon"></span>
      <h3 class="modal-title" data-i18n="profile.deleteTitle"></h3>
      <p class="text-2" data-i18n="profile.deleteText"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" data-modal-close data-i18n="founders.cancel"></button>
        <button type="button" class="btn btn-danger" id="delete-confirm" data-i18n="founders.delete"></button>
      </div>
    </dialog>
  </main>

  <script type="module" src="../../../shared/layout.js"></script>
  <script type="module" src="../../../shared/guard.js"></script>
  <script type="module" src="../../../shared/ui.js"></script>
  <script type="module" src="profile.js?v=4"></script>
</body>
</html>
