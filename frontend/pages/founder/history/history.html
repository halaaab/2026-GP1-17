<!doctype html>
<!--
  HISTORY
  Every project the founder has discussed with Darb: finished assessments and
  conversations that are not finished yet. At the top, four numbers about them.
  Each card opens its conversation, its score, its roadmap or its report.
  The rows come from shared/assessments.js.
-->
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Darb</title>
  <link rel="stylesheet" href="../../../shared/shared.css">
  <link rel="stylesheet" href="history.css">
</head>
<body data-layout="founder" data-page="history" data-denied="403">

  <main>
    <div class="page-head">
      <div>
        <h2 class="page-title" data-i18n="history.title"></h2>
        <p class="text-2" data-i18n="history.sub"></p>
      </div>
      <a class="btn btn-primary" href="../chatbot/chatbot.html" data-i18n="nav.newAssessment"></a>
    </div>

    <!-- four numbers about the founder's work (history.js fills them) -->
    <div class="stats" id="stats">
      <div class="stat is-teal"><span class="stat-icon" data-icon="file"></span><strong data-stat="projects">0</strong><span data-i18n="history.stats.projects"></span></div>
      <div class="stat is-mint"><span class="stat-icon" data-icon="checkCircle"></span><strong data-stat="assessed">0</strong><span data-i18n="history.stats.assessed"></span></div>
      <div class="stat is-purple"><span class="stat-icon" data-icon="trendUp"></span><strong data-stat="average">—</strong><span data-i18n="history.stats.average"></span></div>
      <div class="stat is-gold"><span class="stat-icon" data-icon="map"></span><strong data-stat="roadmaps">0</strong><span data-i18n="history.stats.roadmaps"></span></div>
    </div>

    <div class="toolbar">
      <div class="segmented" id="filter">
        <button type="button" class="segmented-item is-active" data-filter="all" data-i18n="history.all"></button>
        <button type="button" class="segmented-item" data-filter="assessed" data-i18n="history.assessed"></button>
        <button type="button" class="segmented-item" data-filter="conversation" data-i18n="history.conversations"></button>
      </div>
      <label class="search">
        <span id="search-icon"></span>
        <input type="search" id="search" data-i18n-placeholder="history.search" data-i18n-aria-label="history.search">
      </label>
    </div>

    <!-- history.js adds one card for each project -->
    <div class="projects" id="rows"></div>
    <p class="empty" id="empty" data-i18n="history.empty" hidden></p>

    <!-- what the score colors mean -->
    <div class="legend">
      <span class="chip chip-dot chip-good">70–100 · <span data-i18n="score.band.good"></span></span>
      <span class="chip chip-dot chip-warn">40–69 · <span data-i18n="score.band.warn"></span></span>
      <span class="chip chip-dot chip-risk">0–39 · <span data-i18n="score.band.risk"></span></span>
    </div>
  </main>

  <script type="module" src="../../../shared/layout.js"></script>
  <script type="module" src="../../../shared/guard.js"></script>
  <script type="module" src="history.js"></script>
</body>
</html>
