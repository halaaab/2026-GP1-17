<!doctype html>
<!--
  REQUIREMENT DETAILS (founder side, also open to visitors)
  One regulatory requirement: when it applies, what to do, the fees, and its
  key facts and official links. Opened from the Regulatory Explorer:
    requirement-details.html?id=GEN-001
  The same design as the Startup details page: a colored head (the same color
  as the requirement's card), then two columns.
  A missing requirement opens the 404 page, a load failure the 500 page.
-->
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Darb</title>
  <link rel="icon" href="../../../../favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="../../../../assets/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="../../../../assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../../../../shared/shared.css">
  <link rel="stylesheet" href="requirement-details.css?v=3">
</head>
<body data-layout="founder" data-page="requirements" data-title="nav.requirements" data-access="public">

  <main>
    <a class="req-back" id="back-link" href="../requirements-explorer/requirements-explorer.html">
      <span id="back-icon"></span>
      <span data-i18n="nav.requirements"></span>
    </a>

    <!-- shown while the requirement loads -->
    <div class="req-loading" id="loading">
      <div class="skeleton req-skeleton-hero"></div>
      <div class="skeleton req-skeleton-line"></div>
      <div class="skeleton req-skeleton-block"></div>
    </div>

    <article id="details" hidden>
      <!-- Head: logo, name, authority, tags. The color class is set by the script. -->
      <header class="req-hero" id="hero">
        <span class="req-hero-art" id="hero-art" aria-hidden="true"></span>
        <span class="req-logo" id="logo" aria-hidden="true"></span>
        <div class="req-title">
          <h2 id="name"></h2>
          <p class="req-sub" id="authority"></p>
          <div class="req-tags" id="tags"></div>
        </div>
        <button type="button" class="btn btn-secondary btn-sm req-share" id="share">
          <span id="share-icon"></span>
          <span data-i18n="reg.share"></span>
        </button>
      </header>

      <div class="req-layout">
        <div class="req-main">
          <!-- When it applies and to which sectors: a green box, a tick before each line -->
          <section class="req-section">
            <h3 class="section-title" data-i18n="reg.appliesWhen"></h3>
            <ul class="req-checks" id="applies"></ul>
          </section>

          <!-- What to do: numbered steps, each in its own box -->
          <section class="req-section" id="steps-section">
            <div class="req-section-head">
              <h3 class="section-title" data-i18n="reg.guidance"></h3>
              <span class="req-count" id="steps-count"></span>
            </div>
            <ol class="req-steps" id="steps"></ol>
          </section>

          <section class="req-section" id="fees-section">
            <h3 class="section-title" data-i18n="reg.fees"></h3>
            <p class="req-text" id="fees"></p>
          </section>

        </div>

        <!-- Key facts and the official links -->
        <aside class="req-side">
          <div class="req-facts" id="facts"></div>
          <a class="btn req-apply" id="service-link" target="_blank" rel="noopener noreferrer">
            <span data-i18n="reg.applyHere"></span><span id="apply-icon"></span>
          </a>
          <a class="btn btn-secondary req-source" id="source-link" target="_blank" rel="noopener noreferrer">
            <span data-i18n="reg.openSource"></span><span id="source-icon"></span>
          </a>
          <div class="req-note"><span id="note-icon"></span><span id="note"></span></div>
        </aside>
      </div>
    </article>
  </main>

  <script type="module" src="../../../../shared/layout.js"></script>
  <script type="module" src="../../../../shared/guard.js"></script>
  <script type="module" src="../../../../shared/ui.js"></script>
  <script type="module" src="requirement-details.js?v=3"></script>
</body>
</html>
