<!doctype html>
<!--
  RESET PASSWORD
  People arrive here from the link in the reset email. Three screens in one page:
    1. "form"     choose a new password
    2. "done"     password updated
    3. "expired"  the link is too old or was already used
  The side panel, "Back to home" and the language button come from shared/layout.js (data-layout="auth").
-->
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Darb — Set a new password</title>
  <link rel="icon" href="../../../favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="../../../assets/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="../../../assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../../../shared/shared.css">
  <link rel="stylesheet" href="reset-password.css">
  <script>
    // Keep the page hidden until reset-password.js knows whether the link still works
    document.documentElement.classList.add('is-checking');
    // Remember what the email link put in the address before Supabase reads it and clears it
    window.resetLink = window.location.hash + window.location.search;
  </script>
</head>
<body data-layout="auth">

  <main>

    <!-- ============ 1. Choose a new password ============ -->
    <section class="screen" data-screen="form">
      <h1 class="auth-title" data-i18n="reset.title"></h1>
      <p class="auth-sub" data-i18n="reset.sub"></p>

      <div class="alert alert-risk" id="form-error" hidden></div>

      <form class="form" id="reset-form" novalidate>
        <div class="field">
          <label class="label is-required" for="password" data-i18n="reset.new"></label>
          <div class="input-group">
            <input class="input" id="password" name="password" type="password" autocomplete="new-password" dir="ltr">
            <button type="button" class="btn-icon" data-password-toggle data-i18n-aria-label="auth.showPassword">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <!-- each rule gets a tick as soon as the password meets it -->
          <ul class="rules" id="rules">
            <li data-rule="length" data-i18n="reset.rule1"></li>
            <li data-rule="lower" data-i18n="reset.rule2"></li>
            <li data-rule="upper" data-i18n="reset.rule3"></li>
            <li data-rule="number" data-i18n="reset.rule4"></li>
            <li data-rule="symbol" data-i18n="reset.rule5"></li>
          </ul>
          <p class="field-error" data-error-for="password" hidden></p>
        </div>

        <div class="field">
          <label class="label is-required" for="confirm" data-i18n="reset.confirm"></label>
          <input class="input" id="confirm" name="confirm" type="password" autocomplete="new-password" dir="ltr">
          <p class="field-error" data-error-for="confirm" hidden></p>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-block" id="submit-button" data-i18n="reset.submit"></button>
      </form>
    </section>

    <!-- ============ 2. Done ============ -->
    <section class="screen" data-screen="done">
      <span class="screen-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
      <h1 class="auth-title" data-i18n="reset.doneTitle"></h1>
      <p class="auth-sub" data-i18n="reset.doneText"></p>
      <div class="screen-actions">
        <button type="button" class="btn btn-primary btn-lg" id="continue-button" data-i18n="reset.continue"></button>
      </div>
    </section>

    <!-- ============ 3. The link no longer works ============ -->
    <section class="screen" data-screen="expired">
      <span class="screen-icon is-warn"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
      <h1 class="auth-title" data-i18n="reset.expiredTitle"></h1>
      <p class="auth-sub" data-i18n="reset.expiredText"></p>
      <div class="screen-actions">
        <a class="btn btn-primary btn-lg" href="../forgot-password/forgot-password.html" data-i18n="reset.requestNew"></a>
        <a class="btn btn-ghost btn-lg" href="../login/login.html" data-i18n="auth.backToLogin"></a>
      </div>
    </section>

  </main>

  <script type="module" src="../../../shared/layout.js"></script>
  <script type="module" src="../../../shared/ui.js"></script>
  <script type="module" src="reset-password.js"></script>
</body>
</html>
