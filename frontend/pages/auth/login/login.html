<!doctype html>
<!--
  SIGN IN
  The photo side and the language switch come from shared/layout.js (data-layout="auth").
  The greeting changes with the time of day (login.js).
-->
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Darb — Sign in</title>
  <link rel="icon" href="../../../favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="../../../assets/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="../../../assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../../../shared/shared.css">
  <link rel="stylesheet" href="login.css">
  <script>
    // Coming back from Google, or already signed in: keep the form hidden until
    // the page knows where to send the person, so it never flashes on screen.
    var comingBack = location.hash.indexOf('access_token') > -1 || location.search.indexOf('code=') > -1;
    var signedIn = Object.keys(localStorage).some(function (key) { return key.indexOf('sb-') === 0 && key.indexOf('-auth-token') > -1; });
    if (comingBack || signedIn) document.documentElement.classList.add('is-checking');
  </script>
</head>
<body data-layout="auth">

  <main>
    <h1 class="auth-title" id="greeting"></h1>
    <p class="auth-sub" data-i18n="login.sub"></p>

    <button type="button" class="btn btn-secondary btn-lg btn-block btn-google" id="google-button">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.5 12.2c0-.800-.100-1.5-.200-2.2H12v4.2h5.9a5 5 0 0 1-2.2 3.3v2.7h3.5c2.1-1.9 3.3-4.7 3.3-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.5-2.7c-1 .700-2.3 1.1-3.8 1.1-2.9 0-5.3-1.9-6.2-4.5H2.2v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.8 14.1a6.6 6.6 0 0 1 0-4.2V7.1H2.2a11 11 0 0 0 0 9.8l3.6-2.8z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.600 4.2 1.6l3.1-3.1A11 11 0 0 0 2.2 7.1l3.6 2.8C6.7 7.3 9.1 5.4 12 5.4z"/></svg>
      <span data-i18n="auth.google"></span>
    </button>

    <div class="divider-text login-or" data-i18n="auth.or"></div>

    <div class="alert alert-risk" id="form-error" hidden></div>

    <form class="form" id="login-form" novalidate>
      <div class="field">
        <label class="label is-required" for="email" data-i18n="auth.email"></label>
        <input class="input" id="email" name="email" type="email" autocomplete="email" dir="ltr" data-i18n-placeholder="auth.emailPlaceholder">
        <p class="field-error" data-error-for="email" hidden></p>
      </div>

      <div class="field">
        <div class="label-row">
          <label class="label is-required" for="password" data-i18n="auth.password"></label>
          <a class="link" href="../forgot-password/forgot-password.html" data-i18n="auth.forgot"></a>
        </div>
        <div class="input-group">
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" dir="ltr">
          <button type="button" class="btn-icon" data-password-toggle data-i18n-aria-label="auth.showPassword">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <p class="field-error" data-error-for="password" hidden></p>
      </div>

      <button type="submit" class="btn btn-primary btn-lg btn-block" id="submit-button" data-i18n="login.submit"></button>
    </form>

    <p class="auth-switch"><span data-i18n="auth.noAccount"></span> <a class="link" href="../sign-up/sign-up.html" data-i18n="auth.createAccount"></a></p>
  </main>

  <script type="module" src="../../../shared/layout.js"></script>
  <script type="module" src="../../../shared/ui.js"></script>
  <script type="module" src="login.js"></script>
</body>
</html>
