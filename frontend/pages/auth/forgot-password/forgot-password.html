<!doctype html>
<!--
  FORGOT PASSWORD
  Two screens in one page:
    1. "form"  type your email and ask for a reset link
    2. "sent"  check your email
  The side panel, "Back to home" and the language button come from shared/layout.js (data-layout="auth").
-->
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Darb — Reset your password</title>
  <link rel="stylesheet" href="../../../shared/shared.css">
  <link rel="stylesheet" href="forgot-password.css">
</head>
<body data-layout="auth">

  <main>

    <!-- ============ 1. Ask for the link ============ -->
    <section class="screen is-active" data-screen="form">
      <h1 class="auth-title" data-i18n="forgot.title"></h1>
      <p class="auth-sub" data-i18n="forgot.sub"></p>

      <div class="alert alert-risk" id="form-error" hidden></div>

      <form class="form" id="forgot-form" novalidate>
        <div class="field">
          <label class="label is-required" for="email" data-i18n="auth.email"></label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" dir="ltr" data-i18n-placeholder="auth.emailPlaceholder">
          <p class="field-error" data-error-for="email" hidden></p>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-block" id="submit-button" data-i18n="forgot.submit"></button>
      </form>

      <p class="auth-switch"><a class="link" href="../login/login.html" data-i18n="auth.backToLogin"></a></p>
    </section>

    <!-- ============ 2. Check your email ============ -->
    <section class="screen" data-screen="sent">
      <span class="screen-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></span>
      <h1 class="auth-title" data-i18n="forgot.sentTitle"></h1>
      <p class="auth-sub"><span data-i18n="forgot.sentText"></span> <strong id="sent-email" dir="ltr"></strong>, <span data-i18n="forgot.sentText2"></span></p>

      <div class="screen-actions">
        <a class="btn btn-primary btn-lg" href="../login/login.html" data-i18n="auth.backToLogin"></a>
        <button type="button" class="btn btn-ghost btn-lg" id="resend-button" data-i18n="forgot.resend"></button>
      </div>
    </section>

  </main>

  <script type="module" src="../../../shared/layout.js"></script>
  <script type="module" src="forgot-password.js"></script>
</body>
</html>
