<!doctype html>
<!--
  ADMIN OVERVIEW (the admin's home page after signing in)
  A live picture of Darb, read from the database the admin may see:
    - four KPIs for the chosen period, with the change from the period before
    - score health: how the Founder Intelligence Scores are spread
    - activity rhythm: founder actions per day for the last 12 weeks
    - target audience, data health (a to-do list for the admin) and the latest activity
  Everything is drawn by overview-dashboard.js; nothing here is sample data.
-->
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Darb — Admin console</title>
  <link rel="stylesheet" href="../../../shared/shared.css">
  <link rel="stylesheet" href="overview-dashboard.css?v=5">
</head>
<body data-layout="admin" data-page="overview" data-title="admin.overview" data-denied="403">

  <main>
    <!-- Greeting and the period -->
    <header class="ov-head">
      <div class="ov-greeting">
        <p class="eyebrow" id="today"></p>
        <h2 class="display ov-hello" id="hello"></h2>
      </div>
      <div class="ov-controls">
        <div class="segmented" id="period" role="group" data-i18n-aria-label="overview.period">
          <button type="button" class="segmented-item" data-days="7" data-i18n="overview.days7"></button>
          <button type="button" class="segmented-item is-active" data-days="30" data-i18n="overview.days30"></button>
          <button type="button" class="segmented-item" data-days="90" data-i18n="overview.days90"></button>
        </div>
        <button type="button" class="btn-icon ov-refresh" id="refresh" data-i18n-aria-label="overview.refresh"></button>
      </div>
    </header>

    <div class="alert alert-risk" id="load-error" hidden data-i18n="overview.loadError"></div>

    <!-- 1. The pulse: four KPIs -->
    <section class="ov-kpis" id="kpis" aria-live="polite">
      <div class="card ov-kpi"><div class="skeleton ov-skeleton"></div></div>
      <div class="card ov-kpi"><div class="skeleton ov-skeleton"></div></div>
      <div class="card ov-kpi"><div class="skeleton ov-skeleton"></div></div>
      <div class="card ov-kpi"><div class="skeleton ov-skeleton"></div></div>
    </section>

    <!-- 2. Score health -->
    <section class="card ov-card ov-wide">
      <div class="ov-card-head">
        <div>
          <h3 class="section-title" data-i18n="overview.scores"></h3>
          <p class="text-3" data-i18n="overview.scoresSub"></p>
        </div>
        <span class="chip chip-warn" data-i18n="overview.sampleScores"></span>
      </div>
      <div id="scores"></div>
    </section>

    <!-- 3. Activity rhythm -->
    <section class="card ov-card ov-wide">
      <div class="ov-card-head">
        <div>
          <h3 class="section-title" data-i18n="overview.rhythm"></h3>
          <p class="text-3" data-i18n="overview.rhythmSub"></p>
        </div>
        <div class="ov-scale" aria-hidden="true">
          <span data-i18n="overview.less"></span>
          <i class="ov-level-0"></i><i class="ov-level-1"></i><i class="ov-level-2"></i><i class="ov-level-3"></i><i class="ov-level-4"></i>
          <span data-i18n="overview.more"></span>
        </div>
      </div>
      <div class="ov-rhythm">
        <div class="ov-heatmap-wrap"><div class="ov-heatmap" id="heatmap"></div></div>
        <div class="ov-rhythm-facts" id="rhythm-facts"></div>
      </div>
    </section>

    <!-- 4. Target audience -->
    <section class="card ov-card ov-wide">
      <div class="ov-card-head">
        <div>
          <h3 class="section-title" data-i18n="overview.people"></h3>
          <p class="text-3" id="people-sub"></p>
        </div>
        <div class="segmented" id="people-tabs" role="group" data-i18n-aria-label="overview.people">
          <button type="button" class="segmented-item is-active" data-group="type" data-i18n="overview.byType"></button>
          <button type="button" class="segmented-item" data-group="region" data-i18n="overview.byRegion"></button>
        </div>
      </div>
      <!-- one row per founder type (or region): how far its founders get -->
      <div class="table-wrap">
        <table class="table ov-audience">
          <thead>
            <tr>
              <th id="people-group-head"></th>
              <th data-i18n="overview.colFounders"></th>
              <th data-i18n="overview.colIdea"></th>
              <th data-i18n="overview.colAssessed"></th>
              <th data-i18n="overview.colScore"></th>
            </tr>
          </thead>
          <tbody id="people"></tbody>
        </table>
      </div>
      <a class="ov-audience-note" id="people-note" hidden></a>
    </section>

    <div class="ov-row">
      <!-- 5. Data health: what needs the admin -->
      <section class="card ov-card ov-card-grow">
        <div class="ov-card-head">
          <div>
            <h3 class="section-title" data-i18n="overview.health"></h3>
            <p class="text-3" data-i18n="overview.healthSub"></p>
          </div>
          <div class="ov-ring" id="health-ring"></div>
        </div>
        <ul class="ov-checks" id="health"></ul>
      </section>

      <!-- 6. Latest activity -->
      <section class="card ov-card">
        <div class="ov-card-head">
          <div>
            <h3 class="section-title" data-i18n="overview.latest"></h3>
            <p class="text-3" data-i18n="overview.latestSub"></p>
          </div>
        </div>
        <ul class="ov-feed" id="feed"></ul>
      </section>
    </div>

    <p class="text-3 ov-updated" id="updated"></p>

    <!-- one tooltip, shared by every chart -->
    <div class="ov-tip" id="tip" role="tooltip" hidden></div>
  </main>

  <script type="module" src="../../../shared/layout.js"></script>
  <script type="module" src="../../../shared/guard.js"></script>
  <script type="module" src="overview-dashboard.js?v=5"></script>
</body>
</html>
