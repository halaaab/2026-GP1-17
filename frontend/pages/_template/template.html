<!doctype html>

<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Darb</title>
  <link rel="icon" href="../../favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="../../assets/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../../shared/shared.css">
  <link rel="stylesheet" href="template.css">
</head>
<body data-layout="founder" data-page="template" data-title="template.title">

  <main>
    <div class="page-head">
      <div>
        <h2 class="page-title" data-i18n="template.title"></h2>
        <p class="text-2 template-subtitle" data-i18n="template.subtitle"></p>
      </div>
      <button type="button" class="btn btn-primary" id="template-action" data-i18n="template.action"></button>
    </div>

    <div class="grid">
      <div class="card fade-up" style="--i: 0">
        <h3 class="section-title" data-i18n="template.cardTitle"></h3>
        <p class="text-2" data-i18n="template.cardText"></p>
      </div>
      <div class="card fade-up" style="--i: 1">
        <h3 class="section-title" data-i18n="template.cardTitle"></h3>
        <p class="text-2" data-i18n="template.cardText"></p>
      </div>
      <div class="card fade-up" style="--i: 2">
        <h3 class="section-title" data-i18n="template.cardTitle"></h3>
        <p class="text-2" data-i18n="template.cardText"></p>
      </div>
    </div>
  </main>

  <script type="module" src="../../shared/layout.js"></script>
  <script type="module" src="../../shared/guard.js"></script>
  <script type="module" src="template.js"></script>
</body>
</html>
