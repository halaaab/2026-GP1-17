<!doctype html>
<!--
  LANDING PAGE
  - Top bar and footer: built by shared/layout.js (data-layout="public").
  - Text: translations/en.json and ar.json, keys starting with "landing.".
  - Styles for this page only: index.css.   Motion for this page only: index.js.
  - An element with data-reveal fades in when it scrolls into view.
-->
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Darb — Startup Feasibility for Saudi Founders</title>
  <link rel="stylesheet" href="shared/shared.css">
  <link rel="stylesheet" href="index.css?v=28">
</head>
<body data-layout="public">

  <!-- thin line at the top that fills as you scroll: the "path" -->
  <div class="scroll-path" aria-hidden="true"></div>

  <main class="landing">

    <!-- ================= HERO ================= -->
    <section class="hero" id="top">
      <!-- Background photo of Riyadh, faded so the text stays easy to read.
           The picture is set in index.css (assets/images/hero-riyadh.jpg). -->
      <div class="hero-photo" aria-hidden="true"></div>
      <!-- Morning haze that lifts off the city when the page opens -->
      <div class="hero-haze" aria-hidden="true"></div>

      <div class="container hero-inner">
        <div class="hero-text">
          <h1 class="headline hero-title">
            <span class="line"><span data-i18n="landing.heroA"></span></span>
            <span class="line"><span class="accent" data-i18n="landing.heroB"></span></span>
          </h1>
          <p class="lead hero-lead" data-i18n="landing.heroSub"></p>
          <!-- The prompt box types example ideas by itself (index.js). Clicking it goes to sign up. -->
          <a class="glass composer" href="pages/auth/sign-up/sign-up.html" data-i18n-aria-label="landing.ctaPrimary">
            <span class="composer-label" data-i18n="landing.promptLabel"></span>
            <p class="composer-text"><span id="typed"></span><span class="caret"></span></p>
            <span class="composer-row">
              <span class="pill"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.2 6.3 6.3 2.2-6.3 2.2L12 19l-2.2-6.3-6.3-2.2 6.3-2.2z"/></svg><span data-i18n="landing.chatStatus"></span></span>
              <span class="composer-send"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span>
            </span>
          </a>
          <div class="hero-actions">
            <a class="btn btn-primary btn-lg" href="pages/auth/sign-up/sign-up.html">
              <span data-i18n="landing.ctaPrimary"></span>
              <svg class="flip-rtl" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg>
            </a>
            <a class="btn btn-lg hero-secondary" href="#features" data-i18n="landing.ctaSecondary"></a>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= SOURCES STRIP ================= -->
    <section class="container" data-reveal>
      <div class="strip">
        <span class="eyebrow strip-label" data-i18n="landing.sourcesStrip"></span>
        <!-- dir="ltr" keeps the scrolling direction the same in Arabic -->
        <div class="marquee" dir="ltr">
          <div class="marquee-track">
          <img class="marquee-logo" src="assets/images/logos/mc.png" alt="Ministry of Commerce" width="38" height="40">
          <img class="marquee-logo" src="assets/images/logos/monshaat.png" alt="Monsha'at" width="57" height="40">
          <img class="marquee-logo" src="assets/images/logos/zatca.png" alt="ZATCA" width="63" height="40">
          <img class="marquee-logo" src="assets/images/logos/balady.png" alt="Balady" width="94" height="40">
          <img class="marquee-logo" src="assets/images/logos/hrsd.png" alt="HRSD" width="130" height="40">
          <img class="marquee-logo" src="assets/images/logos/qiwa.png" alt="Qiwa" width="47" height="40">
          <img class="marquee-logo" src="assets/images/logos/gosi.png" alt="GOSI" width="99" height="40">
          <img class="marquee-logo" src="assets/images/logos/sbc.png" alt="Saudi Business Center" width="44" height="40">
          <img class="marquee-logo" src="assets/images/logos/fsc.png" alt="Federation of Saudi Chambers" width="71" height="40">
          <img class="marquee-logo" src="assets/images/logos/mim.png" alt="Ministry of Industry and Mineral Resources" width="140" height="40">
          <img class="marquee-logo" src="assets/images/logos/sfda.png" alt="SFDA" width="66" height="40">
          <img class="marquee-logo" src="assets/images/logos/saso.png" alt="SASO" width="96" height="40">
          <img class="marquee-logo" src="assets/images/logos/sdaia.png" alt="SDAIA" width="114" height="40">
          <img class="marquee-logo" src="assets/images/logos/saip.png" alt="SAIP" width="80" height="40">
          <img class="marquee-logo" src="assets/images/logos/spl.png" alt="Saudi Post" width="70" height="40">
          <!-- the same logos again, so the strip can loop without a gap -->
          <img class="marquee-logo" src="assets/images/logos/mc.png" alt="" width="38" height="40" aria-hidden="true">
          <img class="marquee-logo" src="assets/images/logos/monshaat.png" alt="" width="57" height="40" aria-hidden="true">
          <img class="marquee-logo" src="assets/images/logos/zatca.png" alt="" width="63" height="40" aria-hidden="true">
          <img class="marquee-logo" src="assets/images/logos/balady.png" alt="" width="94" height="40" aria-hidden="true">
          <img class="marquee-logo" src="assets/images/logos/hrsd.png" alt="" width="130" height="40" aria-hidden="true">
          <img class="marquee-logo" src="assets/images/logos/qiwa.png" alt="" width="47" height="40" aria-hidden="true">
          <img class="marquee-logo" src="assets/images/logos/gosi.png" alt="" width="99" height="40" aria-hidden="true">
          <img class="marquee-logo" src="assets/images/logos/sbc.png" alt="" width="44" height="40" aria-hidden="true">
          <img class="marquee-logo" src="assets/images/logos/fsc.png" alt="" width="71" height="40" aria-hidden="true">
          <img class="marquee-logo" src="assets/images/logos/mim.png" alt="" width="140" height="40" aria-hidden="true">
          <img class="marquee-logo" src="assets/images/logos/sfda.png" alt="" width="66" height="40" aria-hidden="true">
          <img class="marquee-logo" src="assets/images/logos/saso.png" alt="" width="96" height="40" aria-hidden="true">
          <img class="marquee-logo" src="assets/images/logos/sdaia.png" alt="" width="114" height="40" aria-hidden="true">
          <img class="marquee-logo" src="assets/images/logos/saip.png" alt="" width="80" height="40" aria-hidden="true">
          <img class="marquee-logo" src="assets/images/logos/spl.png" alt="" width="70" height="40" aria-hidden="true">
          </div>
        </div>
      </div>
    </section>

    <!-- ================= SUPPORTED BY =================
         The organisations supporting Darb. To add one, put its logo in
         assets/images/logos/ and add one <img> line here. -->
    <section class="container" data-reveal>
      <div class="supporters">
        <span class="supporters-label" data-i18n="landing.supportedBy"></span>
        <div class="supporters-logos">
          <img src="assets/images/logos/mc.png" alt="Ministry of Commerce" width="49" height="52">
          <img src="assets/images/logos/ecosystemsa.png" alt="Saudi Ecosystem Directory" width="137" height="52">
        </div>
      </div>
    </section>

    <!-- ================= ABOUT =================
         Who Darb is for, said first: the words on one side, and on the other side
         a real photo of a phone showing the assessment. -->
    <section class="container about" id="about">
      <div class="about-text" data-reveal>
        <p class="eyebrow" data-i18n="landing.aboutKicker"></p>
        <h2 class="headline headline-lg" data-i18n="landing.aboutTitle"></h2>
        <p class="lead" data-i18n="landing.aboutP1"></p>
        <p class="lead" data-i18n="landing.aboutP2"></p>
        <ul class="about-points">
          <li class="about-point is-1">
            <span class="about-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span>
            <span class="about-words"><strong data-i18n="landing.values.0.t"></strong><span data-i18n="landing.values.0.b"></span></span>
          </li>
          <li class="about-point is-2">
            <span class="about-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M8.5 14.5A6 6 0 1 1 15.5 14.5c-.6.5-1 1.2-1 2V17h-5v-.5c0-.8-.4-1.5-1-2z"/></svg></span>
            <span class="about-words"><strong data-i18n="landing.values.1.t"></strong><span data-i18n="landing.values.1.b"></span></span>
          </li>
          <li class="about-point is-3">
            <span class="about-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9S9.5 5.5 12 3z"/></svg></span>
            <span class="about-words"><strong data-i18n="landing.values.2.t"></strong><span data-i18n="landing.values.2.b"></span></span>
          </li>
        </ul>
      </div>

      <div class="about-stage" data-reveal aria-hidden="true">
        <!-- soft color behind the hand -->
        <div class="about-rings"></div>

        <!-- A real photo of a hand holding a phone (assets/images/hand-phone.jpg).
             "phone-screen" sits exactly over the photo's blank screen.
             "phone-app" inside it is the assessment page, built at its real phone size
             (360px wide) and then shrunk to fit, so it looks the same as in Darb. -->
        <div class="hand">
          <img class="hand-photo" src="assets/images/hand-phone.jpg" alt="" width="1400" height="1400">
          <div class="phone-screen">
            <div class="phone-app">
              <!-- the phone's own status bar: time on one side of the notch, signal, wifi and battery on the other -->
              <div class="app-status" dir="ltr">
                <span class="app-time">9:41</span>
                <span class="app-status-icons">
                  <svg width="17" height="11" viewBox="0 0 17 11" aria-hidden="true"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
                  <svg width="15" height="11" viewBox="0 0 15 11" aria-hidden="true"><path d="M7.5 2.2c2.2 0 4.2.9 5.6 2.3l1.1-1.1A9.4 9.4 0 0 0 7.5.6 9.4 9.4 0 0 0 .8 3.4l1.1 1.1a7.8 7.8 0 0 1 5.6-2.3zm0 3.2c1.3 0 2.5.5 3.4 1.4l1.1-1.1a6.4 6.4 0 0 0-9 0l1.1 1.1c.9-.9 2.1-1.4 3.4-1.4zm0 3.2c.5 0 .9.2 1.2.5L7.5 10.3 6.3 9.1c.3-.3.7-.5 1.2-.5z"/></svg>
                  <span class="app-battery"><i></i></span>
                </span>
              </div>

              <!-- the app's top bar: back, the page name with the Darb mark, and export -->
              <div class="app-bar">
                <span class="app-round"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></span>
                <span class="app-bar-title"><img src="assets/images/Darb.png" alt=""><b data-i18n="chat.assessment"></b></span>
                <span class="app-round"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg></span>
              </div>

              <strong class="app-title" data-i18n="chat.example.0"></strong>
              <span class="app-chips"><span class="app-chip is-teal" data-i18n="option.food"></span><span class="app-chip" data-i18n="option.riyadh"></span><span class="app-chip is-live"><i></i><span data-i18n="chat.assessment"></span></span></span>
              <div class="app-tabs">
                <span class="is-active" data-i18n="tab.score"></span>
                <span data-i18n="tab.similar"></span>
                <span data-i18n="tab.market"></span>
                <span data-i18n="tab.roadmap"></span>
              </div>

              <div class="app-hero">
                <div class="app-dial" dir="ltr">
                  <svg viewBox="0 0 220 122">
                    <defs><linearGradient id="app-dial-colors" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6FD3DA"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient></defs>
                    <path d="M20 110 A90 90 0 0 1 200 110" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="18" stroke-linecap="round"/>
                    <path d="M20 110 A90 90 0 0 1 200 110" fill="none" stroke="url(#app-dial-colors)" stroke-width="18" stroke-linecap="round" stroke-dasharray="282.7" stroke-dashoffset="79.2"/>
                    <circle cx="167.4" cy="40.6" r="9" fill="#FFFFFF" stroke="#0E2A42" stroke-width="5"/>
                  </svg>
                  <p class="app-number"><strong>72</strong><span>/ 100</span></p>
                </div>
                <span class="app-label" data-i18n="score.title"></span>
                <strong class="app-verdict" data-i18n="score.band.good"></strong>
              </div>

              <div class="app-readings">
                <div class="app-reading"><span class="app-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-9M12 12c0-3.5-2.5-6-6.5-6 0 4 2.5 6.5 6.5 6zM12 14c0-3 2.5-5.5 6.5-5.5 0 3.5-2.5 5.5-6.5 5.5z"/></svg></span><small data-i18n="score.survival"></small><strong data-i18n="survival.good"></strong></div>
                <div class="app-reading"><span class="app-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/></svg></span><small data-i18n="score.risk"></small><strong data-i18n="level.low"></strong></div>
                <div class="app-reading"><span class="app-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l1.5-5h13L20 9M4 9v11h16V9M4 9h16M9 20v-6h6v6"/></svg></span><small data-i18n="score.sector"></small><strong data-i18n="sector.favourable"></strong></div>
              </div>

              <div class="app-box">
                <strong class="app-box-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg><span data-i18n="score.up"></span></strong>
                <div class="app-move"><span data-i18n="score.factor.demand"></span><i><b style="width: 100%"></b></i><em dir="ltr">+14</em></div>
                <div class="app-move"><span data-i18n="score.factor.difference"></span><i><b style="width: 86%"></b></i><em dir="ltr">+12</em></div>
              </div>
            </div>
            <!-- the home bar at the bottom of the screen, and light on the glass -->
            <span class="app-home"></span>
            <span class="phone-glass"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= FEATURES ================= -->
    <section class="container section-head" id="features" data-reveal>
      <p class="eyebrow" data-i18n="landing.featKicker"></p>
      <h2 class="headline headline-lg" data-i18n="landing.featTitle"></h2>
      <p class="lead" data-i18n="landing.featSub"></p>
    </section>

    <!-- Six features in one grid. Each box has a small picture of the feature on top
         (class "feat-art") and its name and one sentence below (class "feat-text").
         "feat-wide" makes a box two columns wide.
         Small pieces with class "float" hover gently over the picture. -->
    <section class="container features">

      <!-- 1. Interactive analysis: a small chat window -->
      <article class="feat feat-wide" id="assistant" data-reveal>
        <div class="feat-art feat-chat" aria-hidden="true">
          <div class="chat-window">
            <div class="chat-head">
              <span class="chat-avatar"><img src="assets/images/Darb.png" alt=""></span>
              <div><strong data-i18n="landing.chatName"></strong><small><i class="live-dot"></i><span data-i18n="landing.chatStatus"></span></small></div>
            </div>
            <div class="chat-body">
              <div class="bubble bubble-bot" style="--i: 0" data-i18n="landing.cv1"></div>
              <div class="bubble bubble-user" style="--i: 1" data-i18n="landing.cv2"></div>
              <div class="bubble bubble-bot typing" style="--i: 2"><i></i><i></i><i></i></div>
            </div>
          </div>
          <!-- what Darb understood from the conversation -->
          <div class="float float-noted">
            <span class="noted-row"><span class="eyebrow" data-i18n="chat.field.sector"></span><span class="chip chip-coral" data-i18n="landing.cvSector"></span></span>
            <span class="noted-row"><span class="eyebrow" data-i18n="chat.field.city"></span><span class="chip chip-coral" data-i18n="landing.cvCity"></span></span>
          </div>
        </div>
        <div class="feat-text">
          <h3 data-i18n="landing.f1t"></h3>
          <p data-i18n="landing.b1"></p>
        </div>
      </article>

      <!-- 2. Survival Score: the gauge fills and counts up to 72 when it scrolls into view -->
      <article class="feat" id="gauge" data-reveal style="--i: 1">
        <div class="feat-art feat-score" aria-hidden="true">
          <div class="score-plate">
            <div class="gauge" dir="ltr">
              <svg viewBox="0 0 200 118">
                <defs><linearGradient id="gauge-colors" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D64545"/><stop offset="0.5" stop-color="#EBC94F"/><stop offset="1" stop-color="#2F9E6E"/></linearGradient></defs>
                <path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="#E6ECF1" stroke-width="16" stroke-linecap="round"/>
                <path id="gauge-arc" d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="url(#gauge-colors)" stroke-width="16" stroke-linecap="round" stroke-dasharray="251.3" stroke-dashoffset="70.4"/>
                <circle id="gauge-knob" cx="150.9" cy="38.3" r="11" fill="#ffffff" stroke="#22895B" stroke-width="5"/>
              </svg>
              <span class="gauge-number" id="gauge-number">72</span>
            </div>
            <span class="chip chip-good" data-i18n="landing.promising"></span>
          </div>
          <!-- the result explains what raised the score and what lowered it -->
          <span class="float float-up"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg><span data-i18n="landing.wfUp"></span></span>
          <span class="float float-down"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"/></svg><span data-i18n="landing.wfDown"></span></span>
        </div>
        <div class="feat-text">
          <h3 data-i18n="landing.f2t"></h3>
          <p data-i18n="landing.b2"></p>
        </div>
      </article>

      <!-- 3. Similar startups. To show a real logo instead of the letter,
           put its file in assets/images/logos/ (foodics.png, sary.png, mrsool.png).
           Until the file is there, the letter shows. -->
      <article class="feat" data-reveal>
        <div class="feat-art feat-similar" aria-hidden="true">
          <ol class="similar-list">
            <li style="--i: 0">
              <span class="similar-logo is-1">F<img src="assets/images/logos/foodics.png" alt="" onerror="this.remove()"></span>
              <span class="similar-name"><strong data-i18n="landing.similar.0.name"></strong><small data-i18n="landing.similar.0.about"></small></span>
              <span class="similar-match" dir="ltr">88%</span>
              <span class="chips"><span class="chip chip-purple" data-i18n="landing.similar.0.tag"></span><span class="chip" data-i18n="landing.similar.0.city"></span><span class="chip chip-teal" data-i18n="landing.similar.0.status"></span></span>
            </li>
            <li style="--i: 1">
              <span class="similar-logo is-2">S<img src="assets/images/logos/sary.png" alt="" onerror="this.remove()"></span>
              <span class="similar-name"><strong data-i18n="landing.similar.1.name"></strong><small data-i18n="landing.similar.1.about"></small></span>
              <span class="similar-match" dir="ltr">74%</span>
            </li>
            <li style="--i: 2">
              <span class="similar-logo is-3">M<img src="assets/images/logos/mrsool.png" alt="" onerror="this.remove()"></span>
              <span class="similar-name"><strong data-i18n="landing.similar.2.name"></strong><small data-i18n="landing.similar.2.about"></small></span>
              <span class="similar-match" dir="ltr">63%</span>
            </li>
          </ol>
        </div>
        <div class="feat-text">
          <h3 data-i18n="landing.f3t"></h3>
          <p data-i18n="landing.b3"></p>
        </div>
      </article>

      <!-- 4. Saudi market insights: a small dashboard.
           The numbers are real: Monsha'at Business Atlas, food and beverage service activities
           (ISIC 56), all of Saudi Arabia, 2025. The file is datasets/market-indicators/. -->
      <article class="feat feat-wide" data-reveal style="--i: 1">
        <div class="feat-art feat-market" aria-hidden="true">
          <div class="market-plate">
            <div class="market-top">
              <span class="market-where"><strong data-i18n="landing.mk.activity"></strong><small data-i18n="landing.mk.place"></small></span>
              <img src="assets/images/logos/monshaat.png" alt="" height="28">
            </div>

            <div class="market-main">
