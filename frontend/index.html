<!doctype html>
<!--
  LANDING PAGE
  - Top bar and footer: built by shared/layout.js (data-layout="public").
  - Text: translations/en.json and ar.json, keys starting with "landing.".
  - Styles for this page only: index.css.   Motion for this page only: index.js.
  - An element with data-reveal fades in when it scrolls into view.
-->
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Darb — Startup Feasibility for Saudi Founders</title>
  <link rel="stylesheet" href="shared/shared.css">
  <link rel="stylesheet" href="index.css">
</head>
<body data-layout="public">

  <!-- thin line at the top that fills as you scroll: the "path" -->
  <div class="scroll-path" aria-hidden="true"></div>

  <main class="landing">

    <!-- ================= HERO ================= -->
    <section class="hero" id="top">
      <!-- Background photo of Riyadh, faded so the text stays easy to read.
           The picture is set in index.css (assets/images/hero-riyadh.jpg). -->
      <div class="hero-photo" aria-hidden="true"></div>
      <!-- Morning haze that lifts off the city when the page opens -->
      <div class="hero-haze" aria-hidden="true"></div>

      <div class="container hero-inner">
        <div class="hero-text">
          <span class="chip chip-teal hero-chip" data-i18n="landing.badgeText"></span>
          <h1 class="headline hero-title">
            <span class="line"><span data-i18n="landing.heroA"></span></span>
            <span class="line"><span class="accent" data-i18n="landing.heroB"></span></span>
          </h1>
          <p class="lead hero-lead" data-i18n="landing.heroSub"></p>
          <div class="hero-actions">
            <a class="btn btn-primary btn-lg" href="pages/auth/sign-up/sign-up.html">
              <span data-i18n="landing.ctaPrimary"></span>
              <svg class="flip-rtl" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg>
            </a>
            <a class="btn btn-lg hero-secondary" href="#features" data-i18n="landing.ctaSecondary"></a>
          </div>
          <!-- The prompt box types example ideas by itself (index.js). Clicking it goes to sign up. -->
          <a class="glass composer" href="pages/auth/sign-up/sign-up.html" data-i18n-aria-label="landing.ctaPrimary">
            <span class="composer-label" data-i18n="landing.promptLabel"></span>
            <p class="composer-text"><span id="typed"></span><span class="caret"></span></p>
            <span class="composer-row">
              <span class="pill"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.2 6.3 6.3 2.2-6.3 2.2L12 19l-2.2-6.3-6.3-2.2 6.3-2.2z"/></svg><span data-i18n="landing.chatStatus"></span></span>
              <span class="composer-send"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span>
            </span>
          </a>
          <ul class="ticks hero-ticks">
            <li><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-i18n="landing.ticks.0"></span></li>
            <li><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-i18n="landing.ticks.1"></span></li>
            <li><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-i18n="landing.ticks.2"></span></li>
          </ul>
        </div>
      </div>
    </section>

    <!-- ================= SOURCES STRIP ================= -->
    <section class="container" data-reveal>
      <div class="strip">
        <span class="eyebrow strip-label" data-i18n="landing.sourcesStrip"></span>
        <!-- dir="ltr" keeps the scrolling direction the same in Arabic -->
        <div class="marquee" dir="ltr">
          <div class="marquee-track">
          <span class="marquee-item"><b>MoC</b><span data-i18n="landing.sources.0.name"></span></span>
          <span class="marquee-item"><b>MSH</b><span data-i18n="landing.sources.1.name"></span></span>
          <span class="marquee-item"><b>ZATCA</b><span data-i18n="landing.sources.2.name"></span></span>
          <span class="marquee-item"><b>BLD</b><span data-i18n="landing.sources.3.name"></span></span>
          <span class="marquee-item"><b>HRSD</b><span data-i18n="landing.sources.4.name"></span></span>
          <span class="marquee-item"><b>GOSI</b><span data-i18n="landing.sources.5.name"></span></span>
          <span class="marquee-item"><b>SDAIA</b><span data-i18n="landing.sources.6.name"></span></span>
          <span class="marquee-item"><b>SFDA</b><span data-i18n="landing.sources.7.name"></span></span>
          <span class="marquee-item"><b>SASO</b><span data-i18n="landing.sources.8.name"></span></span>
          <span class="marquee-item"><b>SAIP</b><span data-i18n="landing.sources.9.name"></span></span>
          <span class="marquee-item"><b>CST</b><span data-i18n="landing.sources.10.name"></span></span>
          <span class="marquee-item"><b>SPL</b><span data-i18n="landing.sources.11.name"></span></span>
          <span class="marquee-item" aria-hidden="true"><b>MoC</b><span data-i18n="landing.sources.0.name"></span></span>
          <span class="marquee-item" aria-hidden="true"><b>MSH</b><span data-i18n="landing.sources.1.name"></span></span>
          <span class="marquee-item" aria-hidden="true"><b>ZATCA</b><span data-i18n="landing.sources.2.name"></span></span>
          <span class="marquee-item" aria-hidden="true"><b>BLD</b><span data-i18n="landing.sources.3.name"></span></span>
          <span class="marquee-item" aria-hidden="true"><b>HRSD</b><span data-i18n="landing.sources.4.name"></span></span>
          <span class="marquee-item" aria-hidden="true"><b>GOSI</b><span data-i18n="landing.sources.5.name"></span></span>
          <span class="marquee-item" aria-hidden="true"><b>SDAIA</b><span data-i18n="landing.sources.6.name"></span></span>
          <span class="marquee-item" aria-hidden="true"><b>SFDA</b><span data-i18n="landing.sources.7.name"></span></span>
          <span class="marquee-item" aria-hidden="true"><b>SASO</b><span data-i18n="landing.sources.8.name"></span></span>
          <span class="marquee-item" aria-hidden="true"><b>SAIP</b><span data-i18n="landing.sources.9.name"></span></span>
          <span class="marquee-item" aria-hidden="true"><b>CST</b><span data-i18n="landing.sources.10.name"></span></span>
          <span class="marquee-item" aria-hidden="true"><b>SPL</b><span data-i18n="landing.sources.11.name"></span></span>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= FEATURES ================= -->
    <section class="container section-head" id="features" data-reveal>
      <p class="eyebrow" data-i18n="landing.featKicker"></p>
      <h2 class="headline headline-lg" data-i18n="landing.featTitle"></h2>
      <p class="lead" data-i18n="landing.featSub"></p>
    </section>

    <!-- 1. Interactive analysis -->
    <section class="container split" id="assistant">
      <div class="split-text" data-reveal>
        <span class="tag"><span class="tag-dot"></span><span data-i18n="landing.f1tag"></span></span>
        <h3 class="headline headline-md" data-i18n="landing.f1t"></h3>
        <p class="lead" data-i18n="landing.f1b"></p>
        <ul class="ticks ticks-column">
          <li style="--i: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-i18n="landing.f1points.0"></span></li>
          <li style="--i: 1"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-i18n="landing.f1points.1"></span></li>
          <li style="--i: 2"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-i18n="landing.f1points.2"></span></li>
        </ul>
      </div>
      <div class="card chat-card" data-reveal aria-hidden="true">
        <div class="chat-head">
          <span class="avatar"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.2 6.3 6.3 2.2-6.3 2.2L12 19l-2.2-6.3-6.3-2.2 6.3-2.2z"/></svg></span>
          <div><strong data-i18n="landing.chatName"></strong><span class="text-3" data-i18n="landing.chatStatus"></span></div>
        </div>
        <div class="chat-body">
          <div class="bubble bubble-bot" style="--i: 0" data-i18n="landing.cv1"></div>
          <div class="bubble bubble-user" style="--i: 1" data-i18n="landing.cv2"></div>
          <div class="bubble bubble-bot" style="--i: 2" data-i18n="landing.cv3"></div>
          <div class="bubble bubble-user" style="--i: 3" data-i18n="landing.cv4"></div>
          <div class="bubble bubble-bot typing" style="--i: 4"><i></i><i></i><i></i></div>
        </div>
        <div class="chat-tools">
          <span class="eyebrow" data-i18n="landing.cvTools"></span>
          <span class="tool"><i></i><span data-i18n="landing.cvToolList.0"></span></span>
          <span class="tool"><i></i><span data-i18n="landing.cvToolList.1"></span></span>
          <span class="tool"><i></i><span data-i18n="landing.cvToolList.2"></span></span>
        </div>
      </div>
    </section>

    <!-- 2. Founder Intelligence Score -->
    <section class="container">
      <div class="section-head" data-reveal>
        <span class="tag"><span class="tag-dot"></span><span data-i18n="landing.f2tag"></span></span>
        <h3 class="headline headline-md" data-i18n="landing.f2t"></h3>
        <p class="lead" data-i18n="landing.f2b"></p>
      </div>
      <div class="score-grid">
        <!-- The gauge fills and counts up to 72 when it scrolls into view -->
        <div class="card gauge-card" data-reveal id="gauge">
          <span class="eyebrow" data-i18n="landing.fisLabel"></span>
          <div class="gauge" dir="ltr">
            <svg viewBox="0 0 200 118" aria-hidden="true">
              <defs><linearGradient id="gauge-colors" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D64545"/><stop offset="0.5" stop-color="#EBC94F"/><stop offset="1" stop-color="#2F9E6E"/></linearGradient></defs>
              <path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="#E6ECF1" stroke-width="16" stroke-linecap="round"/>
              <path id="gauge-arc" d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="url(#gauge-colors)" stroke-width="16" stroke-linecap="round" stroke-dasharray="251.3" stroke-dashoffset="70.4"/>
              <circle id="gauge-knob" cx="150.9" cy="38.3" r="11" fill="#ffffff" stroke="#22895B" stroke-width="5"/>
            </svg>
            <span class="gauge-number" id="gauge-number">72</span>
          </div>
          <div class="gauge-scale" dir="ltr"><span data-i18n="landing.gaugeLow"></span><span data-i18n="landing.gaugeHigh"></span></div>
          <span class="chip chip-good" data-i18n="landing.promising"></span>
          <p class="text-2" data-i18n="landing.gaugeNote"></p>
        </div>
        <div class="card" data-reveal style="--i: 1">
          <div class="wf-head"><strong data-i18n="landing.wfTitle"></strong><span class="chip" data-i18n="landing.example"></span></div>
          <div class="waterfall">
            <div class="wf-row">
              <span data-i18n="landing.waterfall.0.label"></span>
              <div class="wf-track"><div class="wf-bar wf-base" style="inset-inline-start: 0%; width: 50%; --i: 0"></div></div>
              <span class="wf-value wf-value-base">50</span>
            </div>
            <div class="wf-row">
              <span data-i18n="landing.waterfall.1.label"></span>
              <div class="wf-track"><div class="wf-bar wf-up" style="inset-inline-start: 50%; width: 14%; --i: 1"></div></div>
              <span class="wf-value wf-value-up">+14</span>
            </div>
            <div class="wf-row">
              <span data-i18n="landing.waterfall.2.label"></span>
              <div class="wf-track"><div class="wf-bar wf-up" style="inset-inline-start: 64%; width: 12%; --i: 2"></div></div>
              <span class="wf-value wf-value-up">+12</span>
            </div>
            <div class="wf-row">
              <span data-i18n="landing.waterfall.3.label"></span>
              <div class="wf-track"><div class="wf-bar wf-down" style="inset-inline-start: 73%; width: 3%; --i: 3"></div></div>
              <span class="wf-value wf-value-down">−3</span>
            </div>
            <div class="wf-row">
              <span data-i18n="landing.waterfall.4.label"></span>
              <div class="wf-track"><div class="wf-bar wf-down" style="inset-inline-start: 72%; width: 1.5%; --i: 4"></div></div>
              <span class="wf-value wf-value-down">−1</span>
            </div>
            <div class="wf-row wf-row-final">
              <span data-i18n="landing.waterfall.5.label"></span>
              <div class="wf-track"><div class="wf-bar wf-final" style="inset-inline-start: 0%; width: 72%; --i: 5"></div></div>
              <span class="wf-value wf-value-final">72</span>
            </div>
          </div>
          <div class="wf-legend">
            <span><i class="wf-up"></i><span data-i18n="landing.wfUp"></span></span>
            <span><i class="wf-down"></i><span data-i18n="landing.wfDown"></span></span>
            <span class="text-3" data-i18n="landing.exampleNote"></span>
          </div>
        </div>
      </div>
      <div class="insights">
        <div class="card insight" data-reveal style="--i: 0">
          <span class="insight-dot insight-good"></span>
          <div><span class="text-3" data-i18n="landing.insights.0.k"></span><strong data-i18n="landing.insights.0.v"></strong></div>
        </div>
        <div class="card insight" data-reveal style="--i: 1">
          <span class="insight-dot insight-risk"></span>
          <div><span class="text-3" data-i18n="landing.insights.1.k"></span><strong data-i18n="landing.insights.1.v"></strong></div>
        </div>
        <div class="card insight" data-reveal style="--i: 2">
          <span class="insight-dot insight-info"></span>
          <div><span class="text-3" data-i18n="landing.insights.2.k"></span><strong data-i18n="landing.insights.2.v"></strong></div>
        </div>
      </div>
    </section>

    <!-- 3. Similar startups -->
    <section class="container split">
      <div class="split-text" data-reveal>
        <span class="tag"><span class="tag-dot"></span><span data-i18n="landing.f3tag"></span></span>
        <h3 class="headline headline-md" data-i18n="landing.f3t"></h3>
        <p class="lead" data-i18n="landing.f3b"></p>
        <ul class="ticks ticks-column">
          <li style="--i: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-i18n="landing.f3points.0"></span></li>
          <li style="--i: 1"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-i18n="landing.f3points.1"></span></li>
          <li style="--i: 2"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-i18n="landing.f3points.2"></span></li>
        </ul>
      </div>
      <div class="similar-stack" data-reveal aria-hidden="true">
        <div class="card similar-card" style="--i: 0">
          <div class="similar-top"><span class="rank">1</span><div class="mock-name"><strong data-i18n="landing.similar.0.name"></strong><span data-i18n="landing.similar.0.about"></span></div></div>
          <div class="chips"><span class="chip chip-teal" data-i18n="landing.similar.0.tag"></span><span class="chip" data-i18n="landing.similar.0.city"></span><span class="chip chip-navy" data-i18n="landing.similar.0.status"></span></div>
          <div class="similar-match"><span class="text-3" data-i18n="landing.matchLabel"></span><div class="bar"><div class="bar-fill" style="width: 88%"></div></div></div>
        </div>
        <div class="card similar-card" style="--i: 1">
          <div class="similar-top"><span class="rank">2</span><div class="mock-name"><strong data-i18n="landing.similar.1.name"></strong><span data-i18n="landing.similar.1.about"></span></div></div>
          <div class="chips"><span class="chip chip-teal" data-i18n="landing.similar.1.tag"></span><span class="chip" data-i18n="landing.similar.1.city"></span><span class="chip chip-navy" data-i18n="landing.similar.1.status"></span></div>
          <div class="similar-match"><span class="text-3" data-i18n="landing.matchLabel"></span><div class="bar"><div class="bar-fill" style="width: 74%"></div></div></div>
        </div>
        <div class="card similar-card" style="--i: 2">
          <div class="similar-top"><span class="rank">3</span><div class="mock-name"><strong data-i18n="landing.similar.2.name"></strong><span data-i18n="landing.similar.2.about"></span></div></div>
          <div class="chips"><span class="chip chip-teal" data-i18n="landing.similar.2.tag"></span><span class="chip" data-i18n="landing.similar.2.city"></span><span class="chip chip-navy" data-i18n="landing.similar.2.status"></span></div>
          <div class="similar-match"><span class="text-3" data-i18n="landing.matchLabel"></span><div class="bar"><div class="bar-fill" style="width: 63%"></div></div></div>
        </div>
        <span class="mock-caption" data-i18n="landing.exampleNote"></span>
      </div>
    </section>

    <!-- 4. Establishment roadmap: the line draws itself as you scroll -->
    <section class="container">
      <div class="section-head" data-reveal>
        <span class="tag"><span class="tag-dot"></span><span data-i18n="landing.f5tag"></span></span>
        <h3 class="headline headline-md" data-i18n="landing.f5t"></h3>
        <p class="lead" data-i18n="landing.f5b"></p>
      </div>
      <div class="road" id="road">
        <div class="road-line" aria-hidden="true"><div class="road-fill"></div></div>
        <ol class="road-steps">
          <li class="road-step">
            <span class="road-dot"><span data-i18n="landing.journey.0.n"></span></span>
            <div class="card road-card">
              <strong data-i18n="landing.journey.0.title"></strong>
              <span class="text-3" data-i18n="landing.journey.0.auth"></span>
            </div>
          </li>
          <li class="road-step">
            <span class="road-dot"><span data-i18n="landing.journey.1.n"></span></span>
            <div class="card road-card">
              <strong data-i18n="landing.journey.1.title"></strong>
              <span class="text-3" data-i18n="landing.journey.1.auth"></span>
            </div>
          </li>
          <li class="road-step">
            <span class="road-dot"><span data-i18n="landing.journey.2.n"></span></span>
            <div class="card road-card">
              <strong data-i18n="landing.journey.2.title"></strong>
              <span class="text-3" data-i18n="landing.journey.2.auth"></span>
            </div>
          </li>
          <li class="road-step">
            <span class="road-dot"><span data-i18n="landing.journey.3.n"></span></span>
            <div class="card road-card">
              <strong data-i18n="landing.journey.3.title"></strong>
              <span class="text-3" data-i18n="landing.journey.3.auth"></span>
            </div>
          </li>
          <li class="road-step">
            <span class="road-dot"><span data-i18n="landing.journey.4.n"></span></span>
            <div class="card road-card">
              <strong data-i18n="landing.journey.4.title"></strong>
              <span class="text-3" data-i18n="landing.journey.4.auth"></span>
            </div>
          </li>
        </ol>
      </div>
    </section>

    <!-- 5. Report -->
    <section class="container" data-reveal>
      <div class="card report">
        <div class="report-art" aria-hidden="true">
          <div class="report-page"><span></span><span></span><span></span><span></span><b>PDF</b></div>
        </div>
        <div class="report-text">
          <span class="tag"><span class="tag-dot"></span><span data-i18n="landing.f6tag"></span></span>
          <h3 class="headline headline-md" data-i18n="landing.f6t"></h3>
          <p class="lead" data-i18n="landing.f6b"></p>
          <div class="chips">
            <span class="chip chip-navy" data-i18n="landing.f6chips.0"></span>
            <span class="chip chip-navy" data-i18n="landing.f6chips.1"></span>
            <span class="chip chip-navy" data-i18n="landing.f6chips.2"></span>
            <span class="chip chip-navy" data-i18n="landing.f6chips.3"></span>
            <span class="chip chip-navy" data-i18n="landing.f6chips.4"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= EXPLORERS ================= -->
    <section class="container section-head" id="explore" data-reveal>
      <p class="eyebrow" data-i18n="landing.exKicker"></p>
      <h2 class="headline headline-lg" data-i18n="landing.exTitle"></h2>
      <p class="lead" data-i18n="landing.exSub"></p>
    </section>

    <!-- Three explorers in one place. Pick one on the side and its preview shows beside it.
         They also change by themselves every few seconds (index.js). -->
    <section class="container x-explore" id="explorers" data-reveal>
      <div class="x-item is-active" data-x="0">
        <div class="x-tab">
          <button type="button" class="x-head" aria-expanded="true">
            <span class="x-number">01</span>
            <span class="headline x-title" data-i18n="landing.x1t"></span>
          </button>
          <!-- shown only while this explorer is selected -->
